<script src="js/core/audio.js"></script>
<script src="js/core/music.js"></script>
<script src="js/render/draw-helpers.js"></script>

<!-- Fighter registry + one file per fighter -->
<script src="js/game/registry.js"></script>
<script src="js/characters/talpaman.js"></script>
<script src="js/characters/gaara80.js"></script>
<script src="js/characters/menodzero.js"></script>
<script src="js/characters/the-dark-player.js"></script>
<script src="js/characters/kyle-sr84.js"></script>
<script src="js/characters/pat-00.js"></script>
<script src="js/characters/master94ga.js"></script>
<script src="js/characters/mao-gp.js"></script>

<!-- Rendering -->
<script src="js/render/fighter-render.js"></script>
<script src="js/render/stage.js"></script>

<!-- Game logic -->

<script src="js/game/combat.js"></script>
<script src="js/game/projectiles.js"></script>
<script src="js/game/fighter.js"></script>
<script src="js/game/ai.js"></script>
<script src="js/game/effects.js"></script>

<!-- Main loop -->
<script src="js/main.js"></script>
</body>
</html>
