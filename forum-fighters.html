/* ================= INPUT ================= */
const keys={};
const PREVENT=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Slash','Quote','Comma','Period','Backspace','Tab']);
addEventListener('keydown',e=>{keys[e.code]=true;if(PREVENT.has(e.code))e.preventDefault();initAudio();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
cv.addEventListener('pointerdown',()=>{try{cv.focus();}catch(e){}initAudio();});
const KMAP=[
 {l:['KeyA'],r:['KeyD'],u:['KeyW'],d:['KeyS'],p:['KeyF'],k:['KeyG'],s:['KeyH'],x:['KeyJ'],ok:['Enter','Space'],back:['Escape'],pause:['KeyP','Escape'],mute:['KeyM'],quit:['KeyQ']},
 {l:['ArrowLeft'],r:['ArrowRight'],u:['ArrowUp'],d:['ArrowDown'],p:['Comma','Numpad1'],k:['Period','Numpad2'],s:['Slash','Numpad3'],x:['ShiftRight','Numpad0'],ok:['NumpadEnter'],back:['Backspace'],pause:[],mute:[],quit:[]}];
const BTN=Object.keys(KMAP[0]);
const IN=[{},{}],INP=[{},{}];
function pollInput(){
 let pads=[];try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(e){}
 for(let i=0;i<2;i++){
  const c={},m=KMAP[i];
  for(const b of BTN)c[b]=m[b].some(k=>keys[k]);
  const g=pads&&pads[i];
  if(g&&g.connected){const ax=g.axes||[],bt=j=>!!(g.buttons[j]&&g.buttons[j].pressed);
   c.l=c.l||ax[0]<-.45||bt(14);c.r=c.r||ax[0]>.45||bt(15);c.u=c.u||ax[1]<-.6||bt(12);c.d=c.d||ax[1]>.6||bt(13);
   c.p=c.p||bt(2);c.k=c.k||bt(0);c.s=c.s||bt(1);c.x=c.x||bt(3)||bt(5)||bt(7);c.pause=c.pause||bt(9);c.ok=c.ok||bt(9);c.back=c.back||bt(8);}
  INP[i]=IN[i];IN[i]=c;
 }
}
const tap=(i,b)=>!!IN[i][b]&&!INP[i][b];
const tapAny=b=>tap(0,b)||tap(1,b);
const okTap=i=>tap(i,'ok')||tap(i,'p')||tap(i,'k');

/* ================= AUDIO ================= */
let AC=null,master=null,mus=null,musicOn=true,NB=null,nextNote=0,mstep=0;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);mus=AC.createGain();mus.gain.value=.13;mus.connect(master);nextNote=AC.currentTime+.1;}catch(e){AC=null;}}
function tone(f,d,type='square',v=.15,f2=0,delay=0,dest){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.03);}
function noise(d,v=.3,fq=1500,type='bandpass',delay=0,dest){if(!AC)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
 const t=AC.currentTime+delay,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;fl.type=type;fl.frequency.value=fq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(fl);fl.connect(g);g.connect(dest||master);s.start(t);s.stop(t+d+.03);}

 jump(){tone(300,.12,'square',.05,620);},

const CHORDS=[[0,3,7,12],[-4,0,3,8],[-2,2,5,10],[-5,-1,2,7]];
function music(){if(!AC)return;const on=musicOn&&!(game.scene==='fight'&&game.paused);
 if(!on){nextNote=AC.currentTime+.05;return;}
 while(nextNote<AC.currentTime+.15){const s=mstep%64,bar=s>>4,st=s&15,ch=CHORDS[bar],dl=Math.max(0,nextNote-AC.currentTime),root=ch[0];
  const bp=[0,0,12,0,0,12,0,7,0,0,12,0,10,0,7,12][st];
  tone(55*Math.pow(2,(root+bp)/12),.09,'square',.5,0,dl,mus);
  if(st%4===0)tone(140,.12,'sine',1,45,dl,mus);
  if(st%8===4)noise(.08,.5,1800,'bandpass',dl,mus);
  if(st%2===1)noise(.025,.22,8000,'highpass',dl,mus);
  if(game.scene==='fight'&&st%2===0)tone(440*Math.pow(2,ch[(st/2)%4]/12),.08,'triangle',.28,0,dl,mus);
  nextNote+=.105;mstep++;}}
function say(text,lang='en-US',pitch=.55,rate=.95){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.pitch=pitch;u.rate=rate;speechSynthesis.speak(u);}catch(e){}}

const OL='#0a0812';
function rrp(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function rr(x,y,w,h,r,col,ol=2.5){rrp(x,y,w,h,r);ctx.fillStyle=col;ctx.fill();if(ol){ctx.lineWidth=ol;ctx.strokeStyle=OL;ctx.stroke();}}
function circ(x,y,r,col,ol=2.5){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();if(ol){ctx.lineWidth=ol;ctx.strokeStyle=OL;ctx.stroke();}}
function ell(x,y,rx,ry,rot,col,ol=2.5){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();if(ol){ctx.lineWidth=ol;ctx.strokeStyle=OL;ctx.stroke();}}
function line(a,b,w,col,cap='round'){ctx.lineCap=cap;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineWidth=w;ctx.strokeStyle=col;ctx.stroke();}
function limb(pts,w,col){ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.lineWidth=w+5;ctx.strokeStyle=OL;ctx.stroke();ctx.lineWidth=w;ctx.strokeStyle=col;ctx.stroke();}
function quad(h,s,hw,sw,col,ol=3){const dx=s.x-h.x,dy=s.y-h.y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;ctx.beginPath();ctx.moveTo(h.x+nx*hw,h.y+ny*hw);ctx.lineTo(s.x+nx*sw,s.y+ny*sw);ctx.lineTo(s.x-nx*sw,s.y-ny*sw);ctx.lineTo(h.x-nx*hw,h.y-ny*hw);ctx.closePath();ctx.fillStyle=col;ctx.fill();if(ol){ctx.lineJoin='round';ctx.lineWidth=ol;ctx.strokeStyle=OL;ctx.stroke();}}
function seg(o,a,l){return{x:o.x+Math.sin(a)*l,y:o.y+Math.cos(a)*l};}
function txt(s,x,y,size,col,align='center',family=FONT,ol=0,olc=OL,weight=''){ctx.font=(weight?weight+' ':'')+size+'px '+family;ctx.textAlign=align;ctx.textBaseline='middle';if(ol){ctx.lineWidth=ol;ctx.strokeStyle=olc;ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=col;ctx.fillText(s,x,y);}

/* ================= POSES & RIG ================= */
function P0(){return{lean:.08,fa:[.75,2.45],ba:[.45,2.6],fl:[.38,.12],bl:[-.38,-.2],head:0,pf:false,pb:false,hipY:null,rot:0,dy:0};}
function walkP(P,t,s){const p=t*s;P.fl=[.05+.42*Math.sin(p),-.1+.42*Math.sin(p)-.4*Math.max(0,Math.cos(p))];P.bl=[.05-.42*Math.sin(p),-.1-.42*Math.sin(p)-.4*Math.max(0,-Math.cos(p))];}
function crouchP(P){P.fl=[1.2,-.3];P.bl=[-1.15,.3];P.lean=.35;}
function pocket(P){P.pf=P.pb=true;P.fa=[.15,.4];P.ba=[-.05,.3];P.lean=-.04;}
function getPose(f){
 const P=P0(),t=f.anim,id=f.ch.id,st=f.state;
 if(id==='meno')pocket(P);
 switch(st){
  case 'idle':P.dy=Math.sin(t*.12)*1.5;break;
  case 'walk':walkP(P,t,.22*sgn(f.vx*f.face));break;
  case 'crouch':case 'getup':crouchP(P);break;
  case 'jump':P.fl=[1.2,-.15];P.bl=[.45,-.9];break;
  case 'block':P.pf=P.pb=false;P.lean=-.12;P.fa=[1.05,3.0];P.ba=[.85,2.9];break;
  case 'hit':case 'grabbed':case 'locked':P.pf=P.pb=false;P.lean=-.35;P.fa=[-.6,.1];P.ba=[-.9,-.3];P.head=-.3;if(f.air){P.fl=[.7,.2];P.bl=[-.1,-.5];}break;
  case 'stun':P.pf=P.pb=false;P.lean=-.05+Math.sin(t*.3)*.1;P.fa=[.1,0];P.ba=[-.1,0];P.head=Math.sin(t*.25)*.35;break;
  case 'knockdown':case 'ko':P.rot=-Math.PI/2;P.lean=0;P.fl=[.15,.05];P.bl=[-.05,0];P.fa=[.4,1.5];P.ba=[-.3,-1.2];P.pf=P.pb=false;break;
  case 'win':P.pf=false;P.fa=id==='meno'?[2.3,3.5]:[2.95,3.1];if(id!=='meno')P.pb=false;break;
  case 'attack':atkPose(f,P);break;
  case 'skill':case 'super':case 'mcounter':specPose(f,P);break;
 }
 return P;
}
function atkPose(f,P){const a=f.atk;if(!a)return;const m=a.m,fr=a.fr,wind=fr<=m.su,ext=!wind&&fr<=m.su+m.ac+Math.ceil(m.re*.45);
 switch(m.pose){
  case 'punch':P.pf=false;if(wind)P.fa=[.3,2.7];else if(ext){P.fa=[1.57,1.57];P.lean=.22;if(!P.pb)P.ba=[.15,2.1];}break;
  case 'kick':P.lean=-.25;if(wind)P.fl=[1.0,-.3];else if(ext){P.fl=[1.55,1.6];P.bl=[-.12,-.05];}break;
  case 'cpunch':crouchP(P);P.pf=false;if(ext)P.fa=[1.57,1.57];break;
  case 'sweep':crouchP(P);if(ext){P.fl=[1.45,1.62];P.bl=[-1.5,.9];P.hipY=-26;P.lean=.55;}break;
  case 'jpunch':P.fl=[1.2,-.15];P.bl=[.45,-.9];P.pf=false;if(ext)P.fa=[1.2,1.25];break;
  case 'jkick':P.bl=[.3,-.9];if(ext){P.fl=[1.0,1.1];P.lean=-.15;}else P.fl=[1.2,-.15];break;
  case 'upper':P.pf=P.pb=false;P.lean=.1;P.fa=ext?[2.85,3.05]:[.4,2.5];P.fl=[.3,.1];P.bl=[-.5,-.2];break;
 }}
function specPose(f,P){const id=f.ch.id,t=f.t,d=f.data,st=f.state;P.pf=P.pb=false;
 if(st==='mcounter'){P.lean=.3;P.fa=t<8?[2.8,3.1]:[1.0,.7];pocketBack(P);P.fl=[.75,.2];P.bl=[-.65,-.35];return;}
 if(id==='talpa'){if(st==='skill'){crouchP(P);P.fa=[1.3,.6];P.ba=[1.1,.5];}else if(t<40){P.fa=[2.9,3.1];P.ba=[.4,2.5];}else{const k=(t%7)<3;P.fa=k?[1.57,1.5]:[.5,2.3];P.lean=.1;}}
 else if(id==='gaara'){if(st==='skill'||!d.ph||d.ph==='rec'){P.lean=.35;P.fa=[1.57,1.57];P.fl=[.95,.3];P.bl=[-.8,-.4];}
  else if(d.ph==='bar'){const k=(t>>1)&1;P.lean=.2;P.fa=k?[1.57,1.57]:[.6,2.2];P.ba=k?[.4,2.4]:[1.5,1.6];P.fl=[.5,.1];P.bl=[-.5,-.2];}
  else{P.lean=.1;P.fa=[2.85,3.05];P.fl=[.3,.1];P.bl=[-.5,-.2];}}
 else if(id==='meno'){pocket(P);if(st==='skill'){P.pf=false;P.fa=[1.3,2.2];}else walkP(P,f.anim,.14);}
 else if(id==='dark'){P.lean=.12;P.fa=[.55,1.45+Math.sin(t*.9)*.15];P.ba=[.4,1.35+Math.cos(t*.9)*.15];if(st==='super'&&t>=30){P.fa=[1.57,1.6];P.lean=.25;}}

function rig(f,P){const R=f.ch.rig;

function hittable(o){return o.inv<=0&&!['knockdown','getup','ko','win','mcounter'].includes(o.state)&&!o.data.under;}

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function tryHit(f,o,hb,m){const b=wbox(f,hb);if(!hittable(o)||!overlap(b,hurt(o)))return 'miss';return hitRes(f,o,m,b,f.face);}

 if(game.phase!=='fight')return 'none';
 if(menoCheck(d,a))return 'parry';
 const hb=hurt(d),sx=box?clamp(box.x+box.w/2,hb.x,hb.x+hb.w):d.x-dir*15,sy=box?clamp(box.y+box.h/2,hb.y+10,hb.y+hb.h-10):d.y-100;
 if(d.armor>0&&!m.grab&&!m.super){d.armor=0;hurtHP(d,m.dmg*.5);d.flash=8;popText(d.x,d.y-175,'ARMOR!','#ffb347',22);SFX.heavy();hitstop(5);spark(sx,sy,'#fff',10);checkKO(d,a);return 'armor';}
 const canBlock=!m.grab&&!d.air&&['idle','walk','crouch','block'].includes(d.state)&&(dir>0?d.inp.r:d.inp.l);
 if(canBlock){d.state='block';d.t=0;d.bs=m.bs||10;d.vx=dir*(m.kb||3)*.8;d.atk=null;hurtHP(d,m.dmg*(m.super?.2:.06));a.meter+=4;d.meter+=6;SFX.block();spark(sx,sy,'#8fd3ff',8);hitstop(4);checkKO(d,a);return 'block';}

 a.combo++;hurtHP(d,dm);a.meter+=dm*.2;d.meter+=dm*.14;if(a.ch.id==='gaara')a.posts++;
 d.atk=null;d.data={};d.armor=0;d.rot=0;d.cd=null;
 if(m.stun){d.state='stun';d.t=0;d.stunT=m.stun;d.vx=0;}
 else{d.state='hit';d.t=0;d.hs=m.hs||16;d.vx=dir*(m.kb||3)*d.ch.kbm;d.face=-dir;
  if(m.launch||d.air){d.vy=-(m.launch||6);d.launched=true;if(d.y>=GY)d.y=GY-1;}
  if(m.kd){d.vy=Math.min(d.vy,-5);d.launched=true;if(d.y>=GY)d.y=GY-1;}}

 checkKO(d,a);return 'hit';}

function menoCheck(d,a){if(d.ch.id!=='meno')return false;if(d.state==='skill'&&d.data.parry){menoCounter(d,a,false);return true;}if(d.state==='super'&&d.data.exiting){menoCounter(d,a,true);return true;}return false;}

 else if(f.state==='attack'&&f.atk&&f.atk.m.air){f.atk=null;f.state='idle';f.vx=0;}

 else if(f.state==='ko'&&f.vy>5){f.vy=-f.vy*.35;f.y=GY-1;dust(f.x,GY,12);SFX.thud();return true;}
 return false;}

 switch(f.state){
  case 'idle':case 'walk':case 'crouch':{
   f.t++;if(!fight){f.state='idle';f.vx=0;break;}
   if(o.x!==f.x)f.face=sgn(o.x-f.x);
   if(T.x&&f.meter>=100){startSuper(f,o);break;}
   if(T.s&&f.cool<=0){startSkill(f);break;}

  case 'jump':if(fight){if(T.p)startAtk(f,'jpunch');else if(T.k)startAtk(f,'jkick');}break;
  case 'attack':runAtk(f,o);break;
  case 'hit':f.t++;f.vx*=.9;if(!f.air&&!f.launched&&f.t>=f.hs){toIdle(f);o.combo=0;}else if(f.launched&&!f.air&&f.vy===0&&f.t>2){f.state='knockdown';f.t=0;f.launched=false;}break;
  case 'block':f.t++;f.vx*=.85;if(f.t>=f.bs)toIdle(f);break;

  case 'grabbed':phys=false;f.t++;if(!(o.state==='skill'&&o.data.grab)){f.state='hit';f.t=0;f.hs=10;f.rot=0;f.launched=true;phys=true;}break;

  case 'ko':f.vx*=.96;break;

 }
 if(phys&&!f.data.under){

 f.x=clamp(f.x,LW,RW);}

 return I;}

  f.tap={};for(const b of['p','k','s','x','u'])f.tap[b]=!!I[b]&&!f.prev[b];f.prev=I;f.inp=I;}
 updFighter(A,B);updFighter(B,A);pushApart(A,B);updProjs();updFx();
 for(const f of game.F){if(!['hit','locked','stun'].includes(f.state))f.redHp+=(f.hp-f.redHp)*.06;if(f.redHp<f.hp)f.redHp=f.hp;}
 for(const c of[0,1])if(game.combo[c]&&--game.combo[c].t<=0)game.combo[c]=null;
 if(game.phase==='intro'){const fin=A.wins===1&&B.wins===1;if(game.pt===8){say(fin?'Final round':'Round '+game.round,'en-US',.45,.85);SFX.confirm();}if(game.pt===80){say('Fight!','en-US',.45,1);SFX.special();}if(game.pt>=95)game.phase='fight';}
 else if(game.phase==='fight'){if(++game.tick%60===0&&game.timer>0){game.timer--;if(game.timer===0)timeOver();}}
 else if(game.phase==='ko'){
  if(game.pt===120){const w=game.winner;if(w){w.wins++;if(w.state!=='ko'){w.state='win';w.t=0;w.data={};w.atk=null;w.vx=0;w.say={s:pick(w.ch.win),t:0,life:120};}say(w.ch.spoken+' wins','en-US',.5,.95);}else{A.wins++;B.wins++;say('Draw');}}
  if(game.pt===260){if(A.wins>=2||B.wins>=2){const w=A.wins>B.wins?A:B.wins>A.wins?B:null;game.result={w,l:w?other(w):null,quote:w?pick(w.ch.win):''};if(w){w.state='win';w.x=330;w.y=GY;w.face=1;w.alt=w.alt;}game.scene='result';SFX.confirm();}
   else{game.round++;startRound();}}}}

function initSelect(){game.scene='select';const c=[game.picks[0],game.picks[1]];game.sel={c,lock:[false,false],t:0,prev:[null,null]};refreshPrev(0);refreshPrev(1);}
function refreshPrev(i){const s=game.sel;s.prev[i]=new Fighter(CHARS[s.c[i]],i,false);s.prev[1-i]&&(s.prev[1].alt=s.c[0]===s.c[1]);if(i===1)s.prev[1].alt=s.c[0]===s.c[1];}
function selectStep(){const s=game.sel;
 const move=(i,ctrl)=>{if(tap(ctrl,'l')){s.c[i]=(s.c[i]+4)%5;SFX.select();refreshPrev(i);}if(tap(ctrl,'r')){s.c[i]=(s.c[i]+1)%5;SFX.select();refreshPrev(i);}};
 const lock=i=>{s.lock[i]=true;SFX.confirm();say(CHARS[s.c[i]].spoken,'en-US',.5,.95);s.prev[i].state='win';};
 const unlock=i=>{s.lock[i]=false;s.prev[i].state='idle';s.t=0;SFX.select();};
 if(game.mode===0){
  if(!s.lock[0]){move(0,0);move(0,1);if(okTap(0)||okTap(1))lock(0);else if(backTap(0)||backTap(1)){game.scene='title';SFX.select();}}
  else if(!s.lock[1]){move(1,0);move(1,1);if(okTap(0)||okTap(1))lock(1);else if(backTap(0)||backTap(1))unlock(0);}
  else{s.t++;if(backTap(0)||backTap(1))unlock(1);}}
 else{for(const i of[0,1]){if(!s.lock[i]){move(i,i);if(okTap(i))lock(i);else if(i===0&&backTap(0)&&!s.lock[1]){game.scene='title';SFX.select();return;}}else if(backTap(i))unlock(i);}
  if(s.lock[0]&&s.lock[1])s.t++;}
 for(const f of s.prev)if(f){f.anim++;f.t++;}
 if(s.t>=50){game.picks=[s.c[0],s.c[1]];startMatch();}}
function titleStep(){
 if(game.help){if(okTap(0)||backTap(0)||okTap(1)||backTap(1)){game.help=false;SFX.select();}return;}
 if(tapAny('u')){game.menu=(game.menu+3)%4;SFX.select();}if(tapAny('d')){game.menu=(game.menu+1)%4;SFX.select();}
 if(game.menu===2&&(tapAny('l')||tapAny('r'))){game.diff=(game.diff+(tapAny('r')?1:2))%3;SFX.select();}
 if(okTap(0)||okTap(1)){SFX.confirm();if(game.menu===0){game.mode=0;initSelect();}else if(game.menu===1){game.mode=1;initSelect();}else if(game.menu===2)game.diff=(game.diff+1)%3;else game.help=true;}}
function resultStep(){const r=game.result;if(r.w)r.w.anim++;if(okTap(0)||okTap(1)){SFX.confirm();startMatch();}else if(backTap(0)||backTap(1)){SFX.select();initSelect();}}

/* ================= SCENE DRAWING ================= */
function dim(a){ctx.fillStyle='rgba(6,2,14,'+a+')';ctx.fillRect(0,0,W,H);}
function drawTitle(){ctx.drawImage(BG,0,0);dim(.55);
 for(let i=0;i<5;i++)drawPortrait(CHARS[i],120+i*150,392,96,false,false);
 for(let i=0;i<5;i++)txt(CHARS[i].name,168+i*150,500,15,'#fff','center',FONT,4);
 const b=Math.sin(frame*.05)*3;bigText('FORUM',480,78+b,84,-.18);bigText('FIGHTERS',480,150+b,84,-.18);
 txt('IGN ITALIA COMMUNITY EDITION',480,204,18,'#c9b8ff','center',FONT,4);
 const items=['1 PLAYER  vs  CPU','2 PLAYERS  VERSUS','CPU LEVEL:  ◀ '+DIFF[game.diff].name+' ▶','HOW TO PLAY'];
 items.forEach((s,i)=>{const sel=game.menu===i,y=246+i*34;if(sel){ctx.fillStyle='rgba(255,210,58,.16)';ctx.fillRect(330,y-15,300,30);txt('▶',345,y,18,'#ffd23a');}txt(s,480,y,sel?24:20,sel?'#ffd23a':'#e8e0ff','center',FONT,4);});
 txt('W/S or ↑/↓ to choose · ENTER / F to confirm · M music · click the game first if keys do nothing',480,526,12,'#a99bd0','center','sans-serif');
 if(game.help)drawHelp();}
function drawHelp(){dim(.85);bigText('HOW TO PLAY',480,44,40);
 const L=[['PLAYER 1','W A S D move/jump/crouch · F punch · G kick · H skill · J super'],['PLAYER 2','Arrows move · , punch · . kick · / skill · Right Shift super (or Numpad 1 2 3 0)'],['GAMEPAD','Stick/D-pad · X punch · A kick · B skill · Y or RB super · Start pause'],
  ['BLOCK','Hold away from your opponent. Hold down-back against low attacks.'],['SUPER','The meter under your health fills as you hit and get hit. At 100% press Super.'],['COMBOS','A punch or kick that lands can be cancelled into Skill or Super.'],['CROUCH','Down + Punch = low jab · Down + Kick = sweep (knockdown)']];
 L.forEach(([a,b],i)=>{txt(a,90,96+i*30,17,'#ffd23a','left',FONT);txt(b,210,96+i*30,15,'#fff','left','sans-serif');});
 CHARS.forEach((c,i)=>{const y=318+i*38;drawPortrait(c,60,y-16,32,false,false);txt(c.name,104,y-7,16,c.accent==='#f4f7fb'?'#7cc6ee':c.accent,'left',FONT);txt(c.style,104,y+10,11,'#bbb','left','sans-serif');
  txt('SKILL '+c.skill+': '+c.skillDesc,300,y-7,12,'#ddd','left','sans-serif');txt('SUPER '+c.super+': '+c.superDesc,300,y+10,12,'#ddd','left','sans-serif');});
 txt('ENTER / ESC to close',480,526,13,'#a99bd0','center','sans-serif');}
function bar(x,y,w,h,v,col){ctx.fillStyle='#1a1028';ctx.fillRect(x,y,w,h);ctx.fillStyle=col;ctx.fillRect(x,y,w*clamp(v,0,1),h);ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);}
function drawSelect(){const s=game.sel;ctx.drawImage(BG,0,0);dim(.6);
 bigText('SELECT YOUR FIGHTER',480,42,40);
 txt(game.mode?'2 PLAYERS VERSUS':'1 PLAYER vs CPU · '+DIFF[game.diff].name,480,80,15,'#c9b8ff','center',FONT,3);
 for(const i of[0,1]){const f=s.prev[i];if(!f)continue;f.face=i?-1:1;if(!s.lock[i])f.state='idle';
  ctx.save();ctx.translate(i?820:140,350);ctx.scale(1.3,1.3);ctx.translate(-f.x,-GY);drawFighter(f);ctx.restore();
  const ch=f.ch,x=i?495:265,y=100;rr(x,y,200,262,8,'rgba(10,6,22,.85)',0);ctx.strokeStyle=i?'#4aa8ff':'#ff4a5a';ctx.lineWidth=2;rrp(x,y,200,262,8);ctx.stroke();
  txt(i?(game.mode?'PLAYER 2':'CPU'):'PLAYER 1',x+10,y+14,13,i?'#4aa8ff':'#ff4a5a','left',FONT);
  txt(ch.name,x+10,y+38,24,'#fff','left',FONT,4);txt(ch.tag,x+10,y+60,12,'#c9b8ff','left','sans-serif',0,OL,'italic');txt(ch.style,x+10,y+76,12,ch.accent==='#f4f7fb'?'#7cc6ee':ch.accent,'left','sans-serif',0,OL,'bold');
  const st=[['HEALTH',ch.hp/1250],['SPEED',ch.spd/5.6],['POWER',ch.pow/1.4]];st.forEach(([n,v],k)=>{txt(n,x+10,y+96+k*15,10,'#aaa','left','sans-serif',0,OL,'bold');bar(x+64,y+91+k*15,124,9,v,'#ffd23a');});
  let yy=y+150;txt('SKILL · '+ch.skill,x+10,yy,13,'#3bff7f','left',FONT);yy=wrap(ch.skillDesc,x+10,yy+16,180,13,11,'#ddd');
  txt('SUPER · '+ch.super,x+10,yy+4,13,'#ffb347','left',FONT);wrap(ch.superDesc,x+10,yy+20,180,13,11,'#ddd');}
 for(let k=0;k<5;k++){const x=177+k*124,y=378;drawPortrait(CHARS[k],x,y,110,false,false);
  for(const i of[0,1])if(s.c[i]===k){const col=i?'#4aa8ff':'#ff4a5a',pul=s.lock[i]?4:2+Math.sin(frame*.25)*1.5;ctx.strokeStyle=col;ctx.lineWidth=pul+1;ctx.strokeRect(x-i*4+2,y-i*4+2,110+i*8-4,110+i*8-4);
   txt(i?(game.mode?'P2':'CPU'):'P1',x+(i?96:14),y+12,15,col,'center',FONT,3);}
  txt(CHARS[k].name,x+55,y+100,12,'#fff','center',FONT,3);}
 if(s.lock[0]&&s.lock[1]){if((frame>>3)&1)bigText('GET READY!',480,250,46);}
 else txt(game.mode===0&&s.lock[0]?'Now choose your CPU opponent':'◀ ▶ choose · F / ENTER confirm · ESC back',480,520,14,'#c9b8ff','center','sans-serif');}
function drawHUD(){const[A,B]=game.F;
 for(const f of game.F){const L=f.idx===0,bx=L?92:528,bw=340;
  drawPortrait(f.ch,L?12:878,10,70,!L,f.alt);ctx.strokeStyle='#ffd23a';ctx.lineWidth=3;ctx.strokeRect(L?12:878,10,70,70);
  txt(f.ch.name,L?bx+2:bx+bw-2,17,19,'#fff',L?'left':'right',FONT,4);
  rr(bx-3,27,bw+6,28,3,'#2a0a0a',3);const hw=bw*f.hp/f.ch.hp,rw=bw*f.redHp/f.ch.hp;
  ctx.fillStyle='#d01818';ctx.fillRect(L?bx:bx+bw-rw,30,rw,22);
  const g=ctx.createLinearGradient(0,30,0,52);const low=f.hp/f.ch.hp<.25&&(frame>>3)&1;g.addColorStop(0,low?'#ffb0a0':'#fff27a');g.addColorStop(1,low?'#ff5030':'#f5a300');ctx.fillStyle=g;ctx.fillRect(L?bx:bx+bw-hw,30,hw,22);
  const mx=L?92:648,mw=220;bar(mx,60,mw,9,f.meter/100,f.meter>=100?((frame>>2)&1?'#fff':f.ch.accent):'#3ab0ff');txt(f.meter>=100?'SUPER READY!':'SUPER',L?mx+mw+8:mx-8,65,11,f.meter>=100?'#ffd23a':'#9ab','left'===(L?'left':'right')?'left':'right',FONT,3);
  txt('SKILL',L?mx+mw+8:mx-8,79,10,f.cool<=0?'#3bff7f':'#555',L?'left':'right',FONT,3);
  for(let k=0;k<2;k++){const cx=L?412-k*18:548+k*18;circ(cx,79,6,f.wins>k?'#ffd23a':'#2a1840',2);}}
 rr(435,14,90,62,8,'rgba(10,6,22,.8)',3);txt(String(game.timer).padStart(2,'0'),480,47,52,game.timer<=10&&(frame>>4)&1?'#ff4a3a':'#ffd23a','center',FONT,6);
 for(const c of[0,1]){const k=game.combo[c];if(k&&k.n>=2){const x=c?W-130:130;ctx.globalAlpha=Math.min(1,k.t/20);txt(k.n+' HITS',x,170,40,'#ffd23a','center',FONT,6);txt('COMBO!',x,204,20,'#fff','center',FONT,4);ctx.globalAlpha=1;}}}
function drawBanners(){const pt=game.pt,[A,B]=game.F;
 if(game.phase==='intro'||(game.phase==='fight'&&pt<120)){
  if(pt<78){const fin=A.wins===1&&B.wins===1,s=Math.min(1,pt/10);ctx.save();ctx.translate(480,250);ctx.scale(s,s);bigText(fin?'FINAL ROUND':'ROUND '+game.round,0,0,64,-.15,'#fff','#c9e4ff','#4aa8ff');ctx.restore();}
  else if(pt<125){const k=pt-78,s=k<8?2.2-k*.15:1;ctx.save();ctx.translate(480,250);ctx.scale(s,s);bigText('FIGHT!',0,0,110);ctx.restore();}
  if(game.round===1&&game.phase==='intro')txt('P1: WASD · F punch · G kick · H skill · J super     P2: arrows · , . / · Right Shift     P / ESC pause',480,520,13,'#fff','center','sans-serif',3);}
 if(game.phase==='ko'){if(pt<130){const s=pt<10?2.5-pt*.15:1;ctx.save();ctx.translate(480,240);ctx.scale(s,s);bigText(game.koText,0,0,game.koText==='K.O.'?130:80,-.15,'#ffe0e0','#ff3a3a','#8a0000');ctx.restore();}
  else{const w=game.winner;bigText(w?w.ch.name+' WINS':'DRAW',480,240,60);}}
 if(game.freeze>0){const p=1-game.freeze/42,x=-200+Math.min(1,p*3)*680;ctx.save();ctx.translate(x,140);ctx.transform(1,0,-.3,1,0,0);ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(-20,-30,700,60);ctx.fillStyle=game.freezeF.ch.accent;ctx.fillRect(-20,26,700,4);ctx.restore();
  txt(game.superName,x+300,140,36,'#fff','center',FONT,5);}}
function drawFight(){const[A,B]=game.F;
 ctx.save();if(game.shake>0)ctx.translate(rand(-1,1)*game.shake,rand(-1,1)*game.shake);
 ctx.drawImage(BG,0,0);drawFx();
 for(const p of projs)if(p.inert)p.draw(p);
 let order=[A,B];const busy=f=>['attack','skill','super','mcounter'].includes(f.state);if(busy(A)&&!busy(B))order=[B,A];
 if(game.freeze>0&&game.freezeF){const c=game.freezeF;drawFighter(other(c));dim(.6);drawFighter(c);}else order.forEach(drawFighter);
 for(const p of projs)if(!p.inert)p.draw(p);
 drawParticles();for(const f of game.F)drawWorldUI(f);
 ctx.restore();
 if(game.redFlash>0){ctx.fillStyle='rgba(255,30,40,'+(game.redFlash/14*.5)+')';ctx.fillRect(0,0,W,H);}
 drawHUD();drawBanners();
 if(game.paused){dim(.75);bigText('PAUSED',480,150,70);txt('P / ESC  resume      Q  quit to character select      M  music on/off',480,230,16,'#fff','center','sans-serif');
  txt('P1: WASD · F punch · G kick · H skill · J super',480,290,15,'#ffd23a','center','sans-serif');txt('P2: arrows · , punch · . kick · / skill · Right Shift super',480,316,15,'#4aa8ff','center','sans-serif');txt('Block by holding away from your opponent',480,350,14,'#ccc','center','sans-serif');}}
function drawResult(){const r=game.result;ctx.drawImage(BG,0,0);dim(.55);
 if(r.w){ctx.save();ctx.translate(250,470);ctx.scale(1.7,1.7);ctx.translate(-r.w.x,-GY);drawFighter(r.w);ctx.restore();
  bigText(r.w.ch.name,640,120,58);bigText('WINS!',640,185,58,-.15,'#fff','#ffe27a','#f5a300');
  rr(440,240,420,70,12,'#fff',3);ctx.beginPath();ctx.moveTo(445,280);ctx.lineTo(400,300);ctx.lineTo(445,295);ctx.fillStyle='#fff';ctx.fill();wrap('“'+r.quote+'”',460,262,380,22,18,'#111','sans-serif','bold');
  txt(game.F[0].wins+'  –  '+game.F[1].wins,640,350,40,'#ffd23a','center',FONT,5);}
 else bigText('DRAW GAME',480,200,70);
 txt('ENTER / F  rematch       ESC  character select',640,430,18,'#fff','center',FONT,4);}

/* ================= LOOP ================= */
function step(){frame++;pollInput();if(tap(0,'mute'))musicOn=!musicOn;music();
 if(game.scene==='title')titleStep();else if(game.scene==='select')selectStep();else if(game.scene==='fight')fightStep();else if(game.scene==='result')resultStep();}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.filter='none';ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);
 if(game.scene==='title')drawTitle();else if(game.scene==='select')drawSelect();else if(game.scene==='fight')drawFight();else if(game.scene==='result')drawResult();}
let last=0,acc=0;
function loop(ts){requestAnimationFrame(loop);if(!last)last=ts;acc+=Math.min(100,ts-last);last=ts;let n=0;while(acc>=1000/60&&n<4){step();acc-=1000/60;n++;}draw();}
requestAnimationFrame(loop);
try{cv.focus();}catch(e){}
</script>
